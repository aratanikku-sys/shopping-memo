<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>買い物メモ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .quantity button {
            width: 45px;
            height: 45px;
            font-size: 24px;
            border: none;
            border-radius: 8px;
            background: #ddd;
        }

        #quantity {
            width: 60px;
            text-align: center;
            margin: 0;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        .add-button:active {
            opacity: 0.7;
        }

        .list {
            margin-bottom: 20px;
        }

        .item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin: 2px 0 0 0;
            flex-shrink: 0;
        }

        .item-content {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
        }

        .item-quantity {
            margin-top: 4px;
            color: #666;
        }

        .item-memo {
            margin-top: 6px;
            color: #555;
            white-space: pre-wrap;
        }

        .item.checked .item-name,
	.item.checked .item-quantity,
	.item.checked .item-memo {
            text-decoration: none;
        }

	.item.checked {
   	    background-color: #fff3cd;
   	    border-color: #ffc107;
        }

	.item.checked .item-name {
            font-weight: bold;
            color: #856404;
        }

        .delete-button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }
	.priority-button {
	    border: none;
	    background: none;
	    padding: 4px 0 4px 8px;
	    font-size: 20px;
	    letter-spacing: 1px;
	    cursor: pointer;
	    white-space: nowrap;
	    flex-shrink: 0;
	}

.priority-button:active {
    opacity: 0.6;
}
    </style>
</head>

<body>
<div id="loginArea">
  <button id="loginButton">Googleでログイン</button>
  <button id="logoutButton" hidden>ログアウト</button>
  <p id="loginStatus">ログインしていません</p>
</div>

<div class="container">

    <h1>🛒 買い物メモ</h1>

    <div class="input-area">

        <label for="name">商品名</label>
        <input
            type="text"
            id="name"
            placeholder="例：牛乳"
        >

        <label>個数</label>

        <div class="quantity">
            <button type="button" onclick="changeQuantity(-1)">−</button>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >

            <button type="button" onclick="changeQuantity(1)">＋</button>
        </div>

        <label for="memo">メモ</label>
        <textarea
            id="memo"
            placeholder="例：低脂肪乳"
        ></textarea>

        <button class="add-button" onclick="addItem()">
            ＋ 買い物リストに追加
        </button>

    </div>

    <div id="list" class="list"></div>

    <button class="delete-button" onclick="deleteChecked()">
        🗑️ 選択した商品を一括削除
    </button>

</div>

<script>
    let items = [];

    function changeQuantity(amount) {
        const input = document.getElementById("quantity");
        input.value = Math.max(1, Number(input.value) + amount);
    }

    async function addItem() {
        const nameInput = document.getElementById("name");
        const quantityInput = document.getElementById("quantity");
        const memoInput = document.getElementById("memo");

        const name = nameInput.value.trim();
        const quantity = Number(quantityInput.value);
        const memo = memoInput.value.trim();

        if (name === "") {
            alert("商品名を入力してください。");
            return;
        }

        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }

        try {
            await window.sharedShopping.addItem({
                name,
                quantity,
                memo,
		deleteChecked: false,
	        priority: 0
            });

            nameInput.value = "";
            quantityInput.value = 1;
            memoInput.value = "";
        } catch (error) {
            alert("商品の追加に失敗しました。ログイン状態と通信を確認してください。");
            console.error(error);
        }
    }

    function displayItems() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        if (items.length === 0) {
            list.innerHTML = `
                <div class="empty">買い物リストは空です。</div>
            `;
            return;
        }

        items.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "item";

            if (item.checked) {
                div.classList.add("checked");
            }

            div.innerHTML = `
                <input
                    type="checkbox"
                    ${item.checked ? "checked" : ""}
                    onchange="toggleItem(${index})"
                >
                <div class="item-content">
                    <div class="item-name">${escapeHTML(item.name)}</div>
                    <div class="item-quantity">${item.quantity}個</div>
                    ${
                        item.memo
                            ? `<div class="item-memo">${escapeHTML(item.memo)}</div>`
                            : ""
                    }
                </div>
            `;

            list.appendChild(div);
        });
    }

    async function toggleItem(index) {
        const item = items[index];
        if (!item || !window.sharedShopping) return;

        try {
            await window.sharedShopping.updateItem(item.id, {
                checked: !item.checked
            });
        } catch (error) {
            alert("チェック状態を更新できませんでした。");
            console.error(error);
        }
    }


    async function deleteChecked() {
        if (!window.sharedShopping) {
        alert("Googleログインしてください。");
        return;
        }

        const targets = items.filter(item => item.checked);

        if (targets.length === 0) {
        alert("削除する商品にチェックを入れてください。");
        return;
        }

        try {
            await Promise.all(
                targets.map(item =>
                window.sharedShopping.deleteItem(item.id)
                )
            );
        } catch (error) {
            alert("削除に失敗しました: " + error.message);
            console.error(error);
        }
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    displayItems();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyARjqUQbzRzCohqksJQLcB6BCJ2aBRMXkI",
    authDomain: "shopping-memo-cdd46.firebaseapp.com",
    projectId: "shopping-memo-cdd46",
    storageBucket: "shopping-memo-cdd46.firebasestorage.app",
    messagingSenderId: "516050821193",
    appId: "1:516050821193:web:a285fb3a4d1f383621df98",
    measurementId: "G-FLXCX0395Y"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  const itemsRef = collection(db, "shoppingItems");

  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");
  const loginStatus = document.getElementById("loginStatus");

  let unsubscribeItems = null;

  loginButton.addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      loginStatus.textContent = "ログイン失敗: " + error.message;
    }
  });

  logoutButton.addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      loginStatus.textContent = "ログアウト失敗: " + error.message;
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (unsubscribeItems) {
      unsubscribeItems();
      unsubscribeItems = null;
    }

    window.sharedShopping = null;
    window.items = [];

    if (!user) {
      itemsClear();
      loginStatus.textContent = "ログインしていません";
      loginButton.hidden = false;
      logoutButton.hidden = true;
      return;
    }

    loginStatus.textContent = "ログイン中: " + user.email;
    loginButton.hidden = true;
    logoutButton.hidden = false;

    window.sharedShopping = {
      addItem: (data) => addDoc(itemsRef, {
        ...data,
        createdAt: Date.now()
      }),

      updateItem: (id, data) =>
        updateDoc(doc(db, "shoppingItems", id), data),

      deleteItem: (id) =>
        deleteDoc(doc(db, "shoppingItems", id))
    };

    unsubscribeItems = onSnapshot(
      itemsRef,
      (snapshot) => {
        window.items = snapshot.docs.map(document => ({
          id: document.id,
          ...document.data()
        }));

        window.items.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

        // 最初のscriptで使う商品一覧を更新
        itemsReplace(window.items);
        loginStatus.textContent = "共有リスト接続中: " + user.email;
      },
      (error) => {
        loginStatus.textContent =
          "共有リストを読み込めません。権限設定を確認してください。";
        console.error("Firestore error:", error);
      }
    );
  });

  function itemsClear() {
    itemsReplace([]);
  }

  function itemsReplace(newItems) {
    // 最初のscriptのitems変数を更新する
    window.updateShoppingItems?.(newItems);
  }

  window.updateShoppingItems = (newItems) => {
    items = newItems;
    window.items = newItems;
    renderSharedItems(newItems);
  };

  function renderSharedItems(newItems) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (newItems.length === 0) {
    list.innerHTML = '<div class="empty">買い物リストは空です。</div>';
    return;
  }

  // 優先度が高い順
  // 同じ優先度なら、削除チェックなし → あり
  const sortedItems = [...newItems].sort((a, b) => {
    const priorityA = Number(a.priority || 0);
    const priorityB = Number(b.priority || 0);

    if (priorityA !== priorityB) {
      return priorityB - priorityA;
    }

    const deleteA = a.deleteChecked ?? a.checked ?? false;
    const deleteB = b.deleteChecked ?? b.checked ?? false;

    if (deleteA !== deleteB) {
      return deleteA ? 1 : -1;
    }

    return (a.createdAt || 0) - (b.createdAt || 0);
  });

  sortedItems.forEach((item) => {
    const div = document.createElement("div");
    div.className = "item";

    // 削除用チェック
    const deleteChecked =
      item.deleteChecked ?? item.checked ?? false;

    if (deleteChecked) {
      div.classList.add("checked");
    }

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!deleteChecked;

    checkbox.addEventListener("change", async () => {
      try {
        await window.sharedShopping.updateItem(item.id, {
          deleteChecked: checkbox.checked
        });
      } catch (error) {
        alert("削除チェックの状態を更新できませんでした。");
        console.error(error);
      }
    });

    // 商品内容
    const content = document.createElement("div");
    content.className = "item-content";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.name;

    const quantity = document.createElement("div");
    quantity.className = "item-quantity";
    quantity.textContent = `${item.quantity}個`;

    content.append(name, quantity);

    if (item.memo) {
      const memo = document.createElement("div");
      memo.className = "item-memo";
      memo.textContent = item.memo;
      content.appendChild(memo);
    }

    // 優先度
    const priority = document.createElement("button");
    priority.className = "priority-button";

    const currentPriority = Number(item.priority || 0);

    if (currentPriority === 0) {
      priority.textContent = "☆☆☆";
    } else if (currentPriority === 1) {
      priority.textContent = "☆☆★";
    } else if (currentPriority === 2) {
      priority.textContent = "☆★★";
    } else {
      priority.textContent = "★★★";
    }

    priority.addEventListener("click", async () => {
      const nextPriority =
        currentPriority >= 3 ? 0 : currentPriority + 1;

      try {
        await window.sharedShopping.updateItem(item.id, {
          priority: nextPriority
        });
      } catch (error) {
        alert("優先度を更新できませんでした。");
        console.error(error);
      }
    });

    div.append(checkbox, content, priority);
    list.appendChild(div);
  });
}
  }
</script>
</body>
</html>
