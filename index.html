<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 文字コードをUTF-8に設定する -->
    <meta charset="UTF-8">

    <!-- スマートフォンなどの画面幅に合わせて表示する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザのタブに表示するタイトル -->
    <title>買い物メモ</title>

    <!-- =========================================
         CSS：画面の見た目・配置・色などを設定する部分
         ========================================= -->
    <style>

        /* すべてのHTML要素に共通する設定 */
        * {
            box-sizing: border-box;
        }

        /* ページ全体の基本設定 */
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* 買い物メモ本体の配置 */
	.container {
	    max-width: 960px;    /* PCでは横幅を広く使う */
	    margin: 0 auto;      /* 左右中央に配置する */
	}

        /* ページのタイトル */
        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* 商品の入力欄全体 */
        .input-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        /* 入力欄の項目名 */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* inputとtextareaに共通するデザイン */
        input:not([type="checkbox"]),
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* メモ入力欄の設定 */
        textarea {
            height: 80px;
            resize: vertical;
        }

	/* 優先度の設定欄 */
	.priority-area {
	    width: 100%;
	    min-width: 0;
	    margin-bottom: 15px;
	}

	/* 優先度の項目名 */
	.priority-area label {
	    display: block;
	    margin-bottom: 6px;
	}

        /* 優先度の星を横並びにする */
        .priority-select {
            display: flex;
            gap: 3px;
        }

        /* 優先度ボタン */
        .priority-select button {
            flex: 1;
            min-width: 0;
            padding: 6px 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        /* 星の部分 */
        .priority-select button span:last-child {
            font-size: 11px;
            letter-spacing: -1px;
        }

        /* 選択中の優先度 */
        .priority-select button.selected {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            font-weight: bold;
        }

        /* 商品追加ボタン */
        .add-button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        /* 商品追加ボタンを押している間の表示 */
        .add-button:active {
            opacity: 0.7;
        }

        /* 商品一覧全体 */
        .list {
            margin-bottom: 20px;
        }

	/* 商品1件ごとのカード */
	.item {
	    background: white;
	    border-radius: 12px;
	    padding: 15px;
	    margin-bottom: 10px;
	
	    /* チェックボックス・商品情報・操作ボタンを配置する */
	    display: grid;
	    grid-template-columns: 28px minmax(0, 1fr) auto;
	    align-items: center;
	    gap: 14px;
	}

        /* 商品カード内のチェックボックス */
        .item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin: 2px 0 0 0;
            flex-shrink: 0;
        }

        /* 商品名・個数・メモをまとめる領域 */
        .item-content {
            min-width: 0;
        }

        /* 商品名 */
        .item-name {
            font-size: 18px;
            font-weight: bold;
        }

        /* 商品の個数 */
        .item-quantity {
            margin-top: 4px;
            color: #666;
        }

        /* 商品のメモ */
        .item-memo {
            margin-top: 6px;
            color: #555;
            white-space: pre-wrap;
        }

        /* 削除対象にチェックが付いた商品カードの文字装飾 */
	.item.checked .item-name,
	.item.checked .item-memo {
	    text-decoration: none;
	}

        /* 削除対象にチェックが付いた商品カードの背景 */
        .item.checked {
            background-color: #fff3cd;
            border-color: #ffc107;
        }

        /* チェック済み商品の商品名 */
        .item.checked .item-name {
            font-weight: bold;
            color: #856404;
        }

        /* 一括削除ボタン */
        .delete-button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            cursor: pointer;
        }

        /* 商品が1件もない場合に表示する文章 */
        .empty {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }

        /* 優先度を表す星ボタン */
        .priority-button {
            border: none;
            background: none;
            padding: 4px 0 4px 8px;
            font-size: 20px;
            letter-spacing: 1px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 星ボタンを押している間の表示 */
        .priority-button:active {
            opacity: 0.6;
        }

        /* =========================================
           優先度変更・商品編集用モーダル
           ========================================= */

        /* 画面全体を覆う背景 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        /* hidden属性が付いているモーダルは非表示にする */
        .modal-overlay[hidden] {
            display: none !important;
        }

        /* モーダル本体 */
        .modal {
            background: white;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            border-radius: 12px;
        }

        /* モーダルのタイトル */
        .modal h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 21px;
        }

        /* モーダル内の入力欄 */
        .modal input:not([type="checkbox"]),
        .modal textarea,
        .modal select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* モーダル内のメモ欄 */
        .modal textarea {
            height: 90px;
            resize: vertical;
        }

        /* モーダル内のボタン配置 */
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* モーダル内のボタン共通設定 */
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* キャンセルボタン */
        .modal-cancel {
            background: #ddd;
            color: #333;
        }

        /* 保存・変更ボタン */
        .modal-save {
            background: #2196f3;
            color: white;
        }

        /* 編集ボタン */
        .edit-button {
            border: none;
            background: #e3f2fd;
            color: #1976d2;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 編集ボタンを押している間 */
        .edit-button:active {
            opacity: 0.6;
        }

        /* 商品カード内の操作ボタン配置 */
	.item-actions {
 	   display: flex;
 	   flex-direction: row;
 	   align-items: center;
 	   justify-content: flex-end;
  	  gap: 10px;
 	   flex-shrink: 0;
	}

	/* =========================================
	   スマートフォン用レイアウト
	   ========================================= */

	@media (max-width: 600px) {

	    /* ページ全体の余白 */
	    body {
	        padding: 12px;
	    }

	    /* メイン画面 */
	    .container {
	        max-width: 100%;
	    }

	    /* タイトル */
	    h1 {
	        font-size: 25px;
	        margin-bottom: 18px;
	    }

	    /* 商品入力欄 */
	    .input-area {
	        padding: 16px;
	    }

	    /* 商品カード */
	    .item {
	        grid-template-columns: 28px minmax(0, 1fr);
	        gap: 10px;
	        padding: 12px;
	    }

	    /* チェックボックス */
	    .item input[type="checkbox"] {
	        width: 22px;
	        height: 22px;
	    }

	    /* 商品情報 */
	    .item-content {
	        min-width: 0;
	        overflow-wrap: anywhere;
	    }

	    /* 操作ボタンを商品情報の下に配置する */
	    .item-actions {
	        grid-column: 2;
	        flex-direction: row;
	        justify-content: flex-end;
	        align-items: center;
	        width: 100%;
	        gap: 10px;
	    }

	    /* 優先度ボタン */
	    .priority-button {
	        font-size: 18px;
	        padding: 6px 4px;
	        min-height: 40px;
	    }

	    /* 編集ボタン */
	    .edit-button {
	        min-height: 40px;
	        padding: 8px 14px;
	        font-size: 14px;
	    }

	    /* 一括削除ボタン */
	    .delete-button {
	        min-height: 46px;
	    }

	    /* モーダル */
	    .modal {
	        padding: 18px;
	        max-height: 90vh;
	    }
	}

    </style>
</head>

<body>

    <!-- =========================================
         HTML：画面に表示する要素を作る部分
         ========================================= -->

    <!-- Googleログイン・ログアウトの操作領域 -->
    <div id="loginArea">

        <!-- Googleログインを開始するボタン -->
        <button id="loginButton">Googleでログイン</button>

        <!-- ログアウトするボタン。最初はhiddenによって非表示 -->
        <button id="logoutButton" hidden>ログアウト</button>

        <!-- 現在のログイン状態を表示する場所 -->
        <p id="loginStatus">ログインしていません</p>

    </div>

    <!-- 買い物メモのメイン画面 -->
    <div class="container">

        <!-- ページタイトル -->
        <h1>🛒 買い物メモ</h1>

        <!-- 商品情報を入力する領域 -->
        <div class="input-area">

            <!-- 商品名の入力欄 -->
            <label for="name">商品名</label>
            <input
                type="text"
                id="name"
                placeholder="例：牛乳"
            >

            <!-- 優先度の設定 -->
	<div class="priority-area">

	    <label>優先度</label>

	    <div class="priority-select">

	        <!-- 優先度0：通常 -->
	        <button type="button" onclick="selectPriority(0)">
	            <span>通常</span>
	            <span>☆☆☆</span>
	        </button>

	        <!-- 優先度1：低 -->
	        <button type="button" onclick="selectPriority(1)">
	            <span>低</span>
	            <span>☆☆★</span>
	        </button>

	        <!-- 優先度2：中 -->
	        <button type="button" onclick="selectPriority(2)">
	            <span>中</span>
	            <span>☆★★</span>
	        </button>
	
	        <!-- 優先度3：高 -->
	        <button type="button" onclick="selectPriority(3)">
	            <span>高</span>
	            <span>★★★</span>
	        </button>
	
	    </div>

	</div>

            </div>

            <!-- 商品のメモ入力欄 -->
            <label for="memo">メモ</label>
            <textarea
                id="memo"
                placeholder="例：低脂肪乳"
            ></textarea>

            <!-- addItem()を実行して商品をリストに追加する -->
            <button
                class="add-button"
                onclick="addItem()"
            >
                ＋ 買い物リストに追加
            </button>

        </div>

        <!-- JavaScriptによって商品一覧を表示する場所 -->
        <div id="list" class="list"></div>

        <!-- deleteChecked()を実行してチェックした商品をまとめて削除する -->
        <button
            class="delete-button"
            onclick="deleteChecked()"
        >
            🗑️ 選択した商品を一括削除
        </button>

    </div>


    <!-- =========================================
         優先度変更用モーダル
         ========================================= -->

    <div
        id="priorityModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal">

            <h2>優先度の変更</h2>

            <p id="priorityItemName"></p>

            <label for="priorityModalSelect">
                変更先の優先度
            </label>

            <select id="priorityModalSelect">
                <option value="0">☆☆☆ 通常</option>
                <option value="1">☆☆★ 低</option>
                <option value="2">☆★★ 中</option>
                <option value="3">★★★ 高</option>
            </select>

            <div class="modal-buttons">

                <button
                    type="button"
                    class="modal-cancel"
                    onclick="closePriorityModal()"
                >
                    キャンセル
                </button>

                <button
                    type="button"
                    class="modal-save"
                    onclick="savePriority()"
                >
                    変更する
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         商品編集用モーダル
         ========================================= -->

    <div
        id="editModal"
        class="modal-overlay"
        hidden
    >

        <div class="modal">

            <h2>商品情報の編集</h2>

            <!-- 商品名 -->
            <label for="editName">
                商品名
            </label>

            <input
                type="text"
                id="editName"
                placeholder="商品名を入力してください"
            >

            <!-- メモ -->
            <label for="editMemo">
                メモ（詳細）
            </label>

            <textarea
                id="editMemo"
                placeholder="商品の詳細を入力してください"
            ></textarea>

            <!-- 優先度 -->
            <label for="editPriority">
                優先度
            </label>

            <select id="editPriority">
                <option value="0">☆☆☆ 通常</option>
                <option value="1">☆☆★ 低</option>
                <option value="2">☆★★ 中</option>
                <option value="3">★★★ 高</option>
            </select>

            <!-- 保存・キャンセル -->
            <div class="modal-buttons">

                <button
                    type="button"
                    class="modal-cancel"
                    onclick="closeEditModal()"
                >
                    キャンセル
                </button>

                <button
                    type="button"
                    class="modal-save"
                    onclick="saveEdit()"
                >
                    保存する
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         JavaScript①：画面の操作・商品の追加や削除
         ========================================= -->
<script>

        // 商品一覧を保持する配列
    // Firebaseから取得した商品データが、この配列に入る
    let items = [];


    // -----------------------------------------
    // 商品の優先度を管理する
    // -----------------------------------------

    // 現在選択されている優先度
    // 0：☆☆☆（通常）
    // 1：☆☆★（低）
    // 2：☆★★（中）
    // 3：★★★（高）
    let selectedPriority = 0;


    // -----------------------------------------
    // 優先度変更モーダルの管理
    // -----------------------------------------

    // 現在、優先度を変更しようとしている商品
    let priorityTargetItem = null;


    // 優先度を変更する関数
    window.selectPriority = function(priority) {

        // 選択された優先度を保存する
        selectedPriority = priority;

        // 優先度選択ボタンを取得する
        const buttons = document.querySelectorAll(
            ".priority-select button"
        );

        // すべてのボタンの選択状態を更新する
        buttons.forEach((button, index) => {
            button.classList.toggle(
                "selected",
                index === priority
            );
        });
    };


    // -----------------------------------------
    // 優先度変更画面を開く
    // -----------------------------------------

    window.openPriorityModal = function(item) {

        // 変更対象の商品を保存する
        priorityTargetItem = item;

        // 商品名を表示する
        document.getElementById("priorityItemName").textContent =
            "商品「" + item.name + "」の優先度を変更します。";

        // 現在の優先度を選択状態にする
        document.getElementById("priorityModalSelect").value =
            String(Number(item.priority || 0));

        // モーダルを表示する
        document.getElementById("priorityModal").hidden = false;
    };


    // -----------------------------------------
    // 優先度変更画面を閉じる
    // -----------------------------------------

    window.closePriorityModal = function() {

        // モーダルを非表示にする
        document.getElementById("priorityModal").hidden = true;

        // 変更対象の商品をリセットする
        priorityTargetItem = null;
    };


    // -----------------------------------------
    // 優先度を変更してFirebaseに保存する
    // -----------------------------------------

    window.savePriority = async function() {

        // 変更対象の商品が存在するか確認する
        if (!priorityTargetItem) {
            return;
        }

        // 変更先の優先度を取得する
        const newPriority = Number(
            document.getElementById("priorityModalSelect").value
        );

        // 現在の優先度を取得する
        const currentPriority =
            Number(priorityTargetItem.priority || 0);

        // 優先度が正しい範囲か確認する
        if (
            !Number.isInteger(newPriority) ||
            newPriority < 0 ||
            newPriority > 3
        ) {
            alert("正しい優先度を選択してください。");
            return;
        }

        // 同じ優先度が選択された場合
        if (newPriority === currentPriority) {
            alert("優先度に変更はありません。");
            return;
        }

        // 変更前と変更後の優先度を表示するための配列
        const priorityNames = [
            "☆☆☆（通常）",
            "☆☆★（低）",
            "☆★★（中）",
            "★★★（高）"
        ];

        // 最終確認
        const result = confirm(
            "「" + priorityTargetItem.name + "」の優先度を変更しますか？\n\n" +
            "現在：" + priorityNames[currentPriority] + "\n" +
            "変更後：" + priorityNames[newPriority]
        );

        // 許可されなかった場合
        if (!result) {
            return;
        }

        // Firebaseとの接続を確認する
        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }

        try {

            // Firebaseの優先度を更新する
            await window.sharedShopping.updateItem(
                priorityTargetItem.id,
                {
                    priority: newPriority
                }
            );

            // 更新成功後に画面を閉じる
            closePriorityModal();

            // 並べ替えはFirestoreのリアルタイム監視によって
            // 自動的に実行される

        } catch (error) {

            alert("優先度を更新できませんでした。");

            console.error(error);
        }
    };

    // -----------------------------------------
    // 商品を追加する関数
    // -----------------------------------------

    // asyncを付けることで、Firebaseへの通信をawaitで待つことができる
    async function addItem() {

        // 商品名・個数・メモの入力欄を取得する
        const nameInput = document.getElementById("name");
        const memoInput = document.getElementById("memo");

        // 入力された値を取得する
        const name = nameInput.value.trim();
        const memo = memoInput.value.trim();

        // 選択されている優先度を取得する
        const priority = selectedPriority;

        // 商品名が空欄の場合は追加しない
        if (name === "") {
            alert("商品名を入力してください。");
            return;
        }

        // Firebaseとの接続ができているか確認する
        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }

        // Firebaseへの商品追加処理
        try {

            // Firebaseに新しい商品データを保存する
            await window.sharedShopping.addItem({

                // 商品名
                name,

                // メモ
                memo,

                // 削除対象にチェックが付いているかどうか
                // 新しく追加した商品はfalse（未チェック）
                deleteChecked: false,

                // 優先度
                priority: priority
            });

            // 商品追加が成功したら入力欄を初期状態に戻す
            nameInput.value = "";

            // メモ欄を空にする
            memoInput.value = "";

            // 優先度を☆☆☆に戻す
            selectPriority(0);

        } catch (error) {

            // 商品追加に失敗した場合のメッセージ
            alert(
                "商品の追加に失敗しました。ログイン状態と通信を確認してください。"
            );

            // エラーの詳細をブラウザの開発者ツールに表示する
            console.error(error);
        }
    }


    // -----------------------------------------
    // チェックした商品を一括削除する関数
    // -----------------------------------------

    async function deleteChecked() {

        // Firebaseに接続しているか確認する
        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }

        // items配列から削除対象の商品だけを取り出す
        const targets = items.filter(
            item => item.deleteChecked ?? item.checked ?? false
        );

        // 削除対象の商品が1件もない場合
        if (targets.length === 0) {
            alert("削除する商品にチェックを入れてください。");
            return;
        }

        // 削除前に確認する
        if (!confirm(`${targets.length}件の商品を削除しますか？`)) {
            return;
        }

        // 対象の商品をFirebaseから削除する
        try {

            // Promise.all()によって複数の削除処理をまとめて実行する
            await Promise.all(
                targets.map(item =>
                    window.sharedShopping.deleteItem(item.id)
                )
            );

        } catch (error) {

            // 削除に失敗した場合のメッセージ
            alert("削除に失敗しました: " + error.message);

            // エラーの詳細を表示する
            console.error(error);
        }
    }

</script>


<!-- =========================================
     JavaScript②：Firebaseとの接続・認証・同期
     type="module"によってimport文を使用できる
     ========================================= -->

<script type="module">

    // Firebaseアプリを初期化する機能を読み込む
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


    // Firebase Authentication（ログイン認証）に必要な機能を読み込む
    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


    // Cloud Firestore（データベース）に必要な機能を読み込む
    import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


    // -----------------------------------------
    // Firebaseの接続設定
    // -----------------------------------------

    const firebaseConfig = {
        apiKey: "AIzaSyARjqUQbzRzCohqksJQLcB6BCJ2aBRMXkI",
        authDomain: "shopping-memo-cdd46.firebaseapp.com",
        projectId: "shopping-memo-cdd46",
        storageBucket: "shopping-memo-cdd46.firebasestorage.app",
        messagingSenderId: "516050821193",
        appId: "1:516050821193:web:a285fb3a4d1f383621df98",
        measurementId: "G-FLXCX0395Y"
    };


    // -----------------------------------------
    // Firebaseの初期化
    // -----------------------------------------

    // 設定情報を使ってFirebaseアプリを初期化する
    const app = initializeApp(firebaseConfig);

    // Firebase Authenticationを利用できるようにする
    const auth = getAuth(app);

    // Firestoreデータベースを利用できるようにする
    const db = getFirestore(app);

    // Googleログイン用の認証プロバイダを作成する
    const provider = new GoogleAuthProvider();

    // Firestore内のshoppingItemsコレクションを参照する
    const itemsRef = collection(db, "shoppingItems");


    // -----------------------------------------
    // HTML要素の取得
    // -----------------------------------------

    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const loginStatus = document.getElementById("loginStatus");


    // Firestoreのリアルタイム監視を停止するための関数
    let unsubscribeItems = null;


    // -----------------------------------------
    // Googleログイン処理
    // -----------------------------------------

    loginButton.addEventListener("click", async () => {

        try {

            // Googleアカウントのログイン画面をポップアップで開く
            await signInWithPopup(auth, provider);

        } catch (error) {

            // ログインに失敗した場合
            loginStatus.textContent =
                "ログイン失敗: " + error.message;
        }
    });


    // -----------------------------------------
    // ログアウト処理
    // -----------------------------------------

    logoutButton.addEventListener("click", async () => {

        try {

            // Firebaseからログアウトする
            await signOut(auth);

        } catch (error) {

            // ログアウトに失敗した場合
            loginStatus.textContent =
                "ログアウト失敗: " + error.message;
        }
    });


    // -----------------------------------------
    // ログイン状態の監視
    // -----------------------------------------

    onAuthStateChanged(auth, (user) => {

        // すでにFirestoreの監視を行っている場合
        if (unsubscribeItems) {

            // 以前の監視を停止する
            unsubscribeItems();

            unsubscribeItems = null;
        }

        // 共有機能を一度リセットする
        window.sharedShopping = null;

        // 商品一覧も空にする
        window.items = [];


        // -----------------------------------------
        // ログアウト状態の場合
        // -----------------------------------------

        if (!user) {

            // 商品一覧を空にする
            itemsClear();

            // ログイン状態の表示を変更する
            loginStatus.textContent = "ログインしていません";

            // ログインボタンを表示する
            loginButton.hidden = false;

            // ログアウトボタンを非表示にする
            logoutButton.hidden = true;

            return;
        }


        // -----------------------------------------
        // ログイン成功時の処理
        // -----------------------------------------

        // ログイン中のメールアドレスを表示する
        loginStatus.textContent =
            "ログイン中: " + user.email;

        // ログインボタンを非表示にする
        loginButton.hidden = true;

        // ログアウトボタンを表示する
        logoutButton.hidden = false;


        // -----------------------------------------
        // 商品データを操作するための関数
        // -----------------------------------------

        // window.sharedShoppingとして公開することで、
        // 最初のscriptからもFirebaseの操作を呼び出せる
        window.sharedShopping = {

            // 商品を追加する関数
            addItem: (data) => addDoc(itemsRef, {

                // 渡された商品データをすべて追加する
                ...data,

                // 商品を追加した時刻を記録する
                createdAt: Date.now()
            }),

            // 商品を更新する関数
            updateItem: (id, data) =>
                updateDoc(
                    doc(db, "shoppingItems", id),
                    data
                ),

            // 商品を削除する関数
            deleteItem: (id) =>
                deleteDoc(
                    doc(db, "shoppingItems", id)
                )
        };


        // -----------------------------------------
        // Firestoreのリアルタイム監視
        // -----------------------------------------

        unsubscribeItems = onSnapshot(

            // 監視するコレクション
            itemsRef,

            // データの取得・変更があったときに実行する処理
            (snapshot) => {

                // Firestoreから取得した商品データを配列に変換する
                window.items = snapshot.docs.map(document => ({

                    // Firestoreが自動的に付けたドキュメントID
                    id: document.id,

                    // 商品のデータを展開する
                    ...document.data()
                }));


                // 商品を追加日時の古い順に並べる
                window.items.sort((a, b) =>
                    (a.createdAt || 0) - (b.createdAt || 0)
                );


                // 最初のscriptで使う商品一覧を更新する
                itemsReplace(window.items);

                // 共有リストへの接続が完了したことを表示する
                loginStatus.textContent =
                    "共有リスト接続中: " + user.email;
            },


            // Firestoreの読み込みに失敗した場合
            (error) => {

                loginStatus.textContent =
                    "共有リストを読み込めません。権限設定を確認してください。";

                console.error("Firestore error:", error);
            }
        );
    });


    // -----------------------------------------
    // 商品一覧を空にする関数
    // -----------------------------------------

    function itemsClear() {

        // 空の配列を渡して商品一覧を更新する
        itemsReplace([]);
    }


    // -----------------------------------------
    // 商品一覧を更新する関数
    // -----------------------------------------

    function itemsReplace(newItems) {

        // 最初のscriptにあるupdateShoppingItems()を呼び出す
        window.updateShoppingItems?.(newItems);
    }


    // -----------------------------------------
    // 商品一覧を画面に反映する関数
    // -----------------------------------------

    window.updateShoppingItems = (newItems) => {

        // 最初のscriptで使用するitems配列を更新する
        items = newItems;

        // window.itemsも同じ商品一覧に更新する
        window.items = newItems;

        // 商品一覧を画面に表示し直す
        renderSharedItems(newItems);
    };


    // =========================================
    // 商品編集モーダルの管理
    // =========================================

    // 現在編集している商品のID
    // renderSharedItems()の外側で管理する
    let editingItemId = null;


    // -----------------------------------------
    // 商品編集画面を開く
    // -----------------------------------------

    window.openEditModal = function(item) {

        // 編集対象の商品IDを保存する
        editingItemId = item.id;

        // 商品名を入力欄に設定する
        document.getElementById("editName").value =
            item.name || "";

        // メモを入力欄に設定する
        document.getElementById("editMemo").value =
            item.memo || "";

        // 優先度を入力欄に設定する
        document.getElementById("editPriority").value =
            String(Number(item.priority || 0));

        // 編集画面を表示する
        document.getElementById("editModal").hidden = false;
    };


    // -----------------------------------------
    // 商品編集画面を閉じる
    // -----------------------------------------

    window.closeEditModal = function() {

        // 編集画面を非表示にする
        document.getElementById("editModal").hidden = true;

        // 編集対象の商品IDをリセットする
        editingItemId = null;
    };


    // -----------------------------------------
    // 商品情報を保存する
    // -----------------------------------------

    window.saveEdit = async function() {

        // 編集対象の商品IDが存在するか確認する
        if (!editingItemId) {
            return;
        }

        // 入力欄から情報を取得する
        const name = document.getElementById("editName").value.trim();

        const memo = document.getElementById("editMemo").value.trim();

        const priority = Number(
            document.getElementById("editPriority").value
        );


        // -----------------------------------------
        // 入力内容の確認
        // -----------------------------------------

        // 商品名が空欄の場合
        if (name === "") {
            alert("商品名を入力してください。");
            return;
        }

        // 優先度が正しい範囲か確認する
        if (
            !Number.isInteger(priority) ||
            priority < 0 ||
            priority > 3
        ) {
            alert("正しい優先度を選択してください。");
            return;
        }

        // Firebaseとの接続を確認する
        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }


        // -----------------------------------------
        // 編集対象の商品を確認
        // -----------------------------------------

        // 現在の商品情報を取得する
        const currentItem = (window.items || []).find(
            item => item.id === editingItemId
        );

        // 商品がすでに削除されている場合
        if (!currentItem) {
            alert("編集対象の商品が見つかりません。");
            closeEditModal();
            return;
        }


        // -----------------------------------------
        // 保存前の確認
        // -----------------------------------------

        // 優先度が変更されているか確認する
        const currentPriority = Number(currentItem.priority || 0);

        if (priority !== currentPriority) {

            const priorityNames = [
                "☆☆☆（通常）",
                "☆☆★（低）",
                "☆★★（中）",
                "★★★（高）"
            ];

            // 優先度変更の最終確認
            const result = confirm(
                "商品の情報を保存します。\n\n" +
                "優先度も変更されます。\n\n" +
                "現在：" + priorityNames[currentPriority] + "\n" +
                "変更後：" + priorityNames[priority] + "\n\n" +
                "この内容で保存しますか？"
            );

            // キャンセルされた場合
            if (!result) {
                return;
            }

        } else {

            // 優先度に変更がない場合も保存確認を行う
            if (!confirm("商品情報を保存しますか？")) {
                return;
            }
        }


        // -----------------------------------------
        // Firebaseへの保存
        // -----------------------------------------

        try {

            // Firebaseの商品情報を更新する
            await window.sharedShopping.updateItem(
                editingItemId,
                {
                    // 商品名
	     　　   name: name,

	        　　// メモ
	        　　memo: memo,

	        　　// 優先度
	        　　priority: priority
                }
            );

            // 保存成功後に編集画面を閉じる
            closeEditModal();

            // 商品一覧はFirestoreのリアルタイム監視によって
            // 自動的に更新される

        } catch (error) {

            alert("商品情報の更新に失敗しました。");

            console.error(error);
        }
    };


    // =========================================
    // 商品一覧の表示・並べ替え・操作を行う関数
    // =========================================

    function renderSharedItems(newItems) {

        // 商品一覧を表示するHTML要素を取得する
        const list = document.getElementById("list");

        // 以前表示されていた商品をすべて消去する
        list.innerHTML = "";


        // -----------------------------------------
        // 商品が存在しない場合
        // -----------------------------------------

        if (newItems.length === 0) {

            list.innerHTML =
                '<div class="empty">買い物リストは空です。</div>';

            return;
        }


        // -----------------------------------------
        // 商品の並べ替え
        // -----------------------------------------

        // 元のnewItems配列を直接変更しないようにコピーしてから並べ替える
        const sortedItems = [...newItems].sort((a, b) => {

            // 商品Aと商品Bの優先度を数値として取得する
            // 優先度が未設定の場合は0とする
            const priorityA = Number(a.priority || 0);
            const priorityB = Number(b.priority || 0);

            // 優先度が異なる場合
            if (priorityA !== priorityB) {

                // 優先度が高い商品を先にする
                return priorityB - priorityA;
            }


            // 削除チェックの状態を取得する
            const deleteA = a.deleteChecked ?? a.checked ?? false;
            const deleteB = b.deleteChecked ?? b.checked ?? false;

            // 削除チェックの状態が異なる場合
            if (deleteA !== deleteB) {

                // チェックなしの商品を先に、チェックありの商品を後にする
                return deleteA ? 1 : -1;
            }


            // 優先度と削除チェックが同じ場合
            // 追加日時が古い商品を先にする
            return (a.createdAt || 0) - (b.createdAt || 0);
        });


        // -----------------------------------------
        // 商品を1件ずつ画面に表示する
        // -----------------------------------------

        sortedItems.forEach((item) => {

            // 商品1件分のdiv要素を作成する
            const div = document.createElement("div");

            div.className = "item";


            // -----------------------------------------
            // 削除用チェックボックスの作成
            // -----------------------------------------

            // 削除対象にチェックが付いているか確認する
            const deleteChecked =
                item.deleteChecked ?? item.checked ?? false;

            // 削除対象にチェックが付いている場合
            if (deleteChecked) {
                div.classList.add("checked");
            }

            // チェックボックスを作成する
            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";
            checkbox.checked = !!deleteChecked;


            // チェック状態が変更されたときの処理
            checkbox.addEventListener("change", async () => {

                try {

                    // 変更後のチェック状態をFirestoreに保存する
                    await window.sharedShopping.updateItem(
                        item.id,
                        {
                            deleteChecked: checkbox.checked
                        }
                    );

                } catch (error) {

                    alert("削除チェックの状態を更新できませんでした。");

                    console.error(error);
                }
            });


            // -----------------------------------------
            // 商品名・個数・メモの表示領域
            // -----------------------------------------

            const content = document.createElement("div");

            content.className = "item-content";

            name.className = "item-name";
            name.textContent = item.name;

            // 商品名を商品情報の領域に追加する
            content.appendChild(name);


            // メモが入力されている場合
            if (item.memo) {

                const memo = document.createElement("div");

                memo.className = "item-memo";
                memo.textContent = item.memo;

                content.appendChild(memo);
            }


            // -----------------------------------------
            // 優先度を表す星ボタンの作成
            // -----------------------------------------

            const priority = document.createElement("button");

            priority.className = "priority-button";

            // 現在の優先度を取得する
            const currentPriority = Number(item.priority || 0);

            // 優先度に応じて星を表示する
            const priorityStars = [
                "☆☆☆",
                "☆☆★",
                "☆★★",
                "★★★"
            ];

            priority.textContent =
                priorityStars[currentPriority] || "☆☆☆";

            // 星ボタンを押したときに優先度変更画面を開く
            priority.addEventListener("click", () => {
                openPriorityModal(item);
            });


            // -----------------------------------------
            // 商品編集ボタンの作成
            // -----------------------------------------

            const editButton = document.createElement("button");

            editButton.className = "edit-button";
            editButton.textContent = "✏️ 編集";

            // 編集ボタンが押されたときの処理
            editButton.addEventListener("click", () => {

                // 対象商品の編集画面を開く
                openEditModal(item);
            });


            // -----------------------------------------
            // 商品カード内の操作領域
            // -----------------------------------------

            const actions = document.createElement("div");

            actions.className = "item-actions";

            // 星ボタンと編集ボタンを追加する
            actions.append(priority, editButton);


            // -----------------------------------------
            // 商品カードを完成させて画面に追加する
            // -----------------------------------------

            // 左からチェックボックス・商品情報・操作ボタンを配置する
            div.append(checkbox, content, actions);

            // 完成した商品カードを商品一覧に追加する
            list.appendChild(div);

        });
    }

</script>
