<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>買い物メモ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .quantity button {
            width: 45px;
            height: 45px;
            font-size: 24px;
            border: none;
            border-radius: 8px;
            background: #ddd;
        }

        #quantity {
            width: 60px;
            text-align: center;
            margin: 0;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            cursor: pointer;
        }

        .add-button:active {
            opacity: 0.7;
        }

        .list {
            margin-bottom: 20px;
        }

        .item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin: 2px 0 0 0;
            flex-shrink: 0;
        }

        .item-content {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
        }

        .item-quantity {
            margin-top: 4px;
            color: #666;
        }

        .item-memo {
            margin-top: 6px;
            color: #555;
            white-space: pre-wrap;
        }

        .item.checked .item-name,
        .item.checked .item-quantity,
        .item.checked .item-memo {
            text-decoration: line-through;
            color: #aaa;
        }

        .delete-button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 買い物メモ</h1>

    <div class="input-area">

        <label for="name">商品名</label>
        <input
            type="text"
            id="name"
            placeholder="例：牛乳"
        >

        <label>個数</label>

        <div class="quantity">
            <button type="button" onclick="changeQuantity(-1)">−</button>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >

            <button type="button" onclick="changeQuantity(1)">＋</button>
        </div>

        <label for="memo">メモ</label>
        <textarea
            id="memo"
            placeholder="例：低脂肪乳"
        ></textarea>

        <button class="add-button" onclick="addItem()">
            ＋ 買い物リストに追加
        </button>

    </div>

    <div id="list" class="list"></div>

    <button class="delete-button" onclick="deleteChecked()">
        🗑️ 購入済みを一括削除
    </button>

</div>

<script>

    // 買い物リスト
    let items = JSON.parse(localStorage.getItem("shoppingItems")) || [];

    //ブラウザ保存
    function saveItems() {
    localStorage.setItem("shoppingItems", JSON.stringify(items));
    }

    // 個数を変更
    function changeQuantity(amount) {

        const quantityInput = document.getElementById("quantity");

        let quantity = Number(quantityInput.value);

        quantity += amount;

        if (quantity < 1) {
            quantity = 1;
        }

        quantityInput.value = quantity;
    }


    // 商品を追加
    function addItem() {

        const nameInput = document.getElementById("name");
        const quantityInput = document.getElementById("quantity");
        const memoInput = document.getElementById("memo");

        const name = nameInput.value.trim();
        const quantity = Number(quantityInput.value);
        const memo = memoInput.value.trim();

        // 商品名が空の場合
        if (name === "") {
            alert("商品名を入力してください。");
            return;
        }

        const item = {
            name: name,
            quantity: quantity,
            memo: memo,
            checked: false
        };

        items.push(item);
　　　　saveItems();

        // 入力欄を初期化
        nameInput.value = "";
        quantityInput.value = 1;
        memoInput.value = "";

        displayItems();
    }


    // 商品一覧を表示
    function displayItems() {

        const list = document.getElementById("list");

        list.innerHTML = "";

        if (items.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    買い物リストは空です。
                </div>
            `;

            return;
        }

        items.forEach((item, index) => {

            const div = document.createElement("div");

            div.className = "item";

            if (item.checked) {
                div.classList.add("checked");
            }

            div.innerHTML = `
                <input
                    type="checkbox"
                    ${item.checked ? "checked" : ""}
                    onchange="toggleItem(${index})"
                >

                <div class="item-content">

                    <div class="item-name">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="item-quantity">
                        ${item.quantity}個
                    </div>

                    ${
                        item.memo
                        ? `<div class="item-memo">${escapeHTML(item.memo)}</div>`
                        : ""
                    }

                </div>
            `;

            list.appendChild(div);
        });
    }


    // チェック状態を変更
    function toggleItem(index) {

        items[index].checked = !items[index].checked;

        saveItems();
        displayItems();
    }


    // チェック済みの商品を削除
    function deleteChecked() {

        items = items.filter(item => !item.checked);

        saveItems();
        displayItems();
    }


    // HTMLとして解釈されないようにする
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // 初期表示
    displayItems();

</script>

</body>
</html>
