<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 文字コードをUTF-8に設定する -->
    <meta charset="UTF-8">

    <!-- スマートフォンなどの画面幅に合わせて表示する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザのタブに表示するタイトル -->
    <title>買い物メモ</title>

    <!-- =========================================
         CSS：画面の見た目・配置・色などを設定する部分
         ========================================= -->
    <style>

        /* すべてのHTML要素に共通する設定 */
        * {
            /* widthやheightにpaddingとborderを含めて計算する */
            box-sizing: border-box;
        }

        /* ページ全体の基本設定 */
        body {
            margin: 0;                  /* ブラウザ標準の外側余白をなくす */
            padding: 20px;               /* 画面の内側に20pxの余白を設ける */
            font-family: sans-serif;     /* 標準的なゴシック系フォントを使用 */
            background: #f5f5f5;         /* ページ全体の背景色 */
            color: #333;                 /* 基本の文字色 */
        }

        /* 買い物メモ本体の配置 */
        .container {
            max-width: 600px;            /* 最大横幅を600pxに制限する */
            margin: 0 auto;              /* 左右の余白を自動にして中央配置する */
        }

        /* ページのタイトル */
        h1 {
            text-align: center;          /* 文字を中央に配置する */
            margin-bottom: 25px;         /* 下側に余白を設ける */
        }

        /* 商品の入力欄全体 */
        .input-area {
            background: white;           /* 背景を白色にする */
            padding: 20px;               /* 内側に余白を設ける */
            border-radius: 12px;         /* 角を丸くする */
            margin-bottom: 20px;         /* 下側に余白を設ける */
        }

        /* 入力欄の項目名 */
        label {
            display: block;              /* 独立した行に表示する */
            font-weight: bold;           /* 太字にする */
            margin-bottom: 6px;          /* 下側に余白を設ける */
        }

        /* inputとtextareaに共通するデザイン */
        input:not([type="checkbox"]),
        textarea {
            width: 100%;                 /* 親要素の横幅いっぱいに広げる */
            padding: 12px;               /* 内側に余白を設ける */
            font-size: 16px;             /* 文字サイズ */
            border: 1px solid #ccc;      /* 枠線を設定する */
            border-radius: 8px;          /* 角を丸くする */
            margin-bottom: 15px;         /* 下側に余白を設ける */
        }

        /* メモ入力欄の設定 */
        textarea {
            height: 80px;                /* 高さを80pxにする */
            resize: vertical;             /* 縦方向のみサイズ変更可能にする */
        }

        /* 個数入力欄と増減ボタンの配置 */
        .quantity {
            display: flex;               /* 子要素を横並びにする */
            align-items: center;         /* 子要素を上下中央に揃える */
            gap: 10px;                   /* 子要素同士の間隔 */
            margin-bottom: 15px;         /* 下側の余白 */
        }

        /* 個数を増減するボタン */
        .quantity button {
            width: 45px;                 /* 横幅 */
            height: 45px;                /* 高さ */
            font-size: 24px;             /* ＋・−の文字サイズ */
            border: none;                /* 枠線をなくす */
            border-radius: 8px;          /* 角を丸くする */
            background: #ddd;            /* 背景色 */
        }

        /* 個数を直接入力する欄 */
        #quantity {
            width: 60px;                 /* 横幅を60pxにする */
            text-align: center;          /* 数字を中央に配置する */
            margin: 0;                   /* 下側の余白をなくす */
        }

        /* 個数と優先度を横並びにする */
        .quantity-priority {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* 個数と優先度の領域 */
        .quantity-area,
        .priority-area {
            flex: 1;
            min-width: 0;
        }

        /* 個数・優先度の設定欄 */
        .quantity-area label,
        .priority-area label {
            display: block;
            margin-bottom: 5px;
        }

        /* 優先度の星を横並びにする */
        .priority-select {
            display: flex;
            gap: 3px;
        }

        /* 優先度ボタン */
        .priority-select button {
            flex: 1;
            min-width: 0;
            padding: 6px 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;

            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        /* 星の部分 */
        .priority-select button span:last-child {
            font-size: 11px;
            letter-spacing: -1px;
        }

        /* 選択中の優先度 */
        .priority-select button.selected {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            font-weight: bold;
        }

        /* 商品追加ボタン */
        .add-button {
            width: 100%;                 /* 横幅いっぱいに広げる */
            padding: 14px;               /* 内側の余白 */
            font-size: 17px;             /* 文字サイズ */
            font-weight: bold;           /* 太字にする */
            border: none;                /* 枠線をなくす */
            border-radius: 8px;          /* 角を丸くする */
            background: #4caf50;         /* 背景色を緑にする */
            color: white;                /* 文字色を白にする */
            cursor: pointer;             /* マウスを乗せたときに指の形にする */
        }

        /* 商品追加ボタンを押している間の表示 */
        .add-button:active {
            opacity: 0.7;                /* 少し透明にする */
        }

        /* 商品一覧全体 */
        .list {
            margin-bottom: 20px;         /* 下側に余白を設ける */
        }

        /* 商品1件ごとのカード */
        .item {
            background: white;           /* 背景色 */
            border-radius: 12px;         /* 角を丸くする */
            padding: 15px;               /* 内側の余白 */
            margin-bottom: 10px;         /* 商品同士の間隔 */

            display: flex;               /* 子要素を横並びにする */
            align-items: flex-start;     /* 子要素を上揃えにする */
            gap: 12px;                   /* 子要素同士の間隔 */
        }

        /* 商品カード内のチェックボックス */
        .item input[type="checkbox"] {
            width: 24px;                 /* 横幅 */
            height: 24px;                /* 高さ */
            margin: 2px 0 0 0;            /* 上側だけ少し余白を設ける */
            flex-shrink: 0;              /* 横幅が縮まないようにする */
        }

        /* 商品名・個数・メモをまとめる領域 */
        .item-content {
            flex: 1;                     /* 余っている横幅をすべて使う */
        }

        /* 商品名 */
        .item-name {
            font-size: 18px;             /* 文字サイズ */
            font-weight: bold;           /* 太字にする */
        }

        /* 商品の個数 */
        .item-quantity {
            margin-top: 4px;             /* 上側の余白 */
            color: #666;                 /* 文字色を灰色にする */
        }

        /* 商品のメモ */
        .item-memo {
            margin-top: 6px;             /* 上側の余白 */
            color: #555;                 /* 文字色 */
            white-space: pre-wrap;       /* 入力された改行をそのまま表示する */
        }

        /* 削除対象にチェックが付いた商品カードの文字装飾 */
        .item.checked .item-name,
        .item.checked .item-quantity,
        .item.checked .item-memo {
            text-decoration: none;      /* 取り消し線を付けない */
        }

        /* 削除対象にチェックが付いた商品カードの背景 */
        .item.checked {
            background-color: #fff3cd;  /* 背景を薄い黄色にする */
            border-color: #ffc107;      /* 枠線の色 */
        }

        /* チェック済み商品の商品名 */
        .item.checked .item-name {
            font-weight: bold;           /* 太字にする */
            color: #856404;              /* 文字色を茶色にする */
        }

        /* 一括削除ボタン */
        .delete-button {
            width: 100%;                 /* 横幅いっぱいに広げる */
            padding: 14px;               /* 内側の余白 */
            font-size: 16px;             /* 文字サイズ */
            border: none;                /* 枠線をなくす */
            border-radius: 8px;          /* 角を丸くする */
            background: #e53935;         /* 背景色を赤にする */
            color: white;                /* 文字色を白にする */
            cursor: pointer;             /* マウスを乗せると指の形にする */
        }

        /* 商品が1件もない場合に表示する文章 */
        .empty {
            text-align: center;          /* 文字を中央に配置する */
            color: #888;                 /* 文字色 */
            padding: 30px 0;             /* 上下に余白を設ける */
        }

        /* 優先度を表す星ボタン */
        .priority-button {
            border: none;                /* 枠線をなくす */
            background: none;            /* 背景色をなくす */
            padding: 4px 0 4px 8px;      /* 内側の余白 */
            font-size: 20px;             /* 星の大きさ */
            letter-spacing: 1px;         /* 星同士の間隔 */
            cursor: pointer;             /* 指の形にする */
            white-space: nowrap;         /* 星を途中で改行しない */
            flex-shrink: 0;              /* 横幅が縮まないようにする */
        }

        /* 星ボタンを押している間の表示 */
        .priority-button:active {
            opacity: 0.6;                /* 少し透明にする */
        }

    </style>
</head>

<body>

<!-- =========================================
     HTML：画面に表示する要素を作る部分
     ========================================= -->

<!-- Googleログイン・ログアウトの操作領域 -->
<div id="loginArea">

    <!-- Googleログインを開始するボタン -->
    <button id="loginButton">Googleでログイン</button>

    <!-- ログアウトするボタン。最初はhiddenによって非表示 -->
    <button id="logoutButton" hidden>ログアウト</button>

    <!-- 現在のログイン状態を表示する場所 -->
    <p id="loginStatus">ログインしていません</p>

</div>

<!-- 買い物メモのメイン画面 -->
<div class="container">

    <!-- ページタイトル -->
    <h1>🛒 買い物メモ</h1>

    <!-- 商品情報を入力する領域 -->
    <div class="input-area">

        <!-- 商品名の入力欄 -->
        <label for="name">商品名</label>
        <input
            type="text"
            id="name"
            placeholder="例：牛乳"
        >

        <!-- 個数と優先度の設定 -->
        <div class="quantity-priority">

            <!-- 個数の入力欄 -->
            <div class="quantity-area">

                <label for="quantity">個数</label>

                <div class="quantity">

                    <!-- 個数を1減らす -->
                    <button type="button" onclick="changeQuantity(-1)">−</button>

                    <!-- 個数を直接入力する -->
                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                    <!-- 個数を1増やす -->
                    <button type="button" onclick="changeQuantity(1)">＋</button>

                </div>
            </div>

            <!-- 優先度の設定 -->
            <div class="priority-area">

                <label>優先度</label>

                <div class="priority-select">
                    <!-- 優先度0：通常 -->
                    <button type="button" onclick="selectPriority(0)">
                        <span>通常</span>
                        <span>☆☆☆</span>
                    </button>

                    <!-- 優先度1：低 -->
                    <button type="button" onclick="selectPriority(1)">
                        <span>低</span>
                        <span>☆☆★</span>
                    </button>

                    <!-- 優先度2：中 -->
                    <button type="button" onclick="selectPriority(2)">
                        <span>中</span>
                        <span>☆★★</span>
                    </button>

                    <!-- 優先度3：高 -->
                    <button type="button" onclick="selectPriority(3)">
                        <span>高</span>
                        <span>★★★</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- 商品のメモ入力欄 -->
        <label for="memo">メモ</label>
        <textarea
            id="memo"
            placeholder="例：低脂肪乳"
        ></textarea>

        <!-- addItem()を実行して商品をリストに追加する -->
        <button class="add-button" onclick="addItem()">
            ＋ 買い物リストに追加
        </button>

    </div>

    <!-- JavaScriptによって商品一覧を表示する場所 -->
    <div id="list" class="list"></div>

    <!-- deleteChecked()を実行してチェックした商品をまとめて削除する -->
    <button class="delete-button" onclick="deleteChecked()">
        🗑️ 選択した商品を一括削除
    </button>

</div>


<!-- =========================================
     JavaScript①：画面の操作・商品の追加や削除
     ========================================= -->

<script>

    // 商品一覧を保持する配列
    // Firebaseから取得した商品データが、この配列に入る
    let items = [];

    // -----------------------------------------
    // 商品の優先度を管理する
    // -----------------------------------------

    // 現在選択されている優先度
    // 0：☆☆☆
    // 1：☆★★
    // 2：★★★
    let selectedPriority = 0;


    // 優先度を変更する関数
    window.selectPriority = function(priority) {

        // 選択された優先度を保存する
        selectedPriority = priority;

        // 優先度選択ボタンを取得する
        const buttons = document.querySelectorAll(".priority-select button");

        // すべてのボタンの選択状態を更新する
        buttons.forEach((button, index) => {

            button.classList.toggle("selected", index === priority);

        });
    };


    // -----------------------------------------
    // 個数を増減する関数
    // -----------------------------------------

    // amountには、増やす場合は1、減らす場合は-1が渡される
    function changeQuantity(amount) {

        // idがquantityである入力欄を取得する
        const input = document.getElementById("quantity");

        // 個数が1以下になるのを防ぐ
        input.value = Math.max(1, Number(input.value) + amount);
    }


    // -----------------------------------------
    // 商品を追加する関数
    // -----------------------------------------

    // asyncを付けることで、Firebaseへの通信をawaitで待つことができる
    async function addItem() {

        // 商品名・個数・メモの入力欄を取得する
        const nameInput = document.getElementById("name");

        const quantityInput = document.getElementById("quantity");

        const memoInput = document.getElementById("memo");

        // 入力された値を取得する
        // trim()は文字列の先頭と末尾にある空白を取り除く
        const name = nameInput.value.trim();

        // Number()によって文字列を数値に変換する
        const quantity = Number(quantityInput.value);

        const memo = memoInput.value.trim();

        // 選択されている優先度を取得する
        const priority = selectedPriority;

        // 商品名が空欄の場合は追加しない
        if (name === "") {
            alert("商品名を入力してください。");
            return;
        }

        // 個数が1以上の整数か確認する
        if (!Number.isInteger(quantity) || quantity < 1) {
            alert("個数は1以上の整数を入力してください。");
            return;
        }

        // Firebaseとの接続ができているか確認する
        if (!window.sharedShopping) {
            alert("Googleログインしてください。");
            return;
        }

        // Firebaseへの商品追加処理
        try {

            // Firebaseに新しい商品データを保存する
            await window.sharedShopping.addItem({

                // 商品名
                name,

                // 個数
                quantity,

                // メモ
                memo,

                // 削除対象にチェックが付いているかどうか
                // 新しく追加した商品はfalse（未チェック）
                deleteChecked: false,

                // 優先度
                // 選択された優先度を保存する
                priority: priority

            });

            // 商品追加が成功したら入力欄を初期状態に戻す
            nameInput.value = "";

            // 個数を1に戻す
            quantityInput.value = 1;

            // メモ欄を空にする
            memoInput.value = "";

            // 優先度を☆☆☆に戻す
            selectPriority(0);

        } catch (error) {

            // 商品追加に失敗した場合のメッセージ
            alert("商品の追加に失敗しました。ログイン状態と通信を確認してください。");

            // エラーの詳細をブラウザの開発者ツールに表示する
            console.error(error);
        }
    }


    // -----------------------------------------
    // チェックした商品を一括削除する関数
    // -----------------------------------------

    async function deleteChecked() {

        // Firebaseに接続しているか確認する
        if (!window.sharedShopping) {

            // ログインしていない場合のメッセージ
            alert("Googleログインしてください。");

            // 処理を終了する
            return;
        }


        // items配列からcheckedがtrueの商品だけを取り出す
        const targets = items.filter(
            item => item.deleteChecked ?? item.checked ?? false
        );


        // 削除対象の商品が1件もない場合
        if (targets.length === 0) {

            // メッセージを表示する
            alert("削除する商品にチェックを入れてください。");

            // 処理を終了する
            return;
        }

        // 削除前に確認する
        if (!confirm(`${targets.length}件の商品を削除しますか？`)) {
            return;
        }

        // 対象の商品をFirebaseから削除する
        try {

            // Promise.all()によって複数の削除処理をまとめて実行する
            await Promise.all(

                // targetsに入っている商品を1件ずつ処理する
                targets.map(item =>

                    // 商品IDを指定してFirebaseから削除する
                    window.sharedShopping.deleteItem(item.id)
                )
            );

        } catch (error) {

            // 削除に失敗した場合のメッセージ
            alert("削除に失敗しました: " + error.message);

            // エラーの詳細を表示する
            console.error(error);
        }
    }

</script>


<!-- =========================================
     JavaScript②：Firebaseとの接続・認証・同期
     type="module"によってimport文を使用できる
     ========================================= -->

<script type="module">

    // Firebaseアプリを初期化する機能を読み込む
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";


    // Firebase Authentication（ログイン認証）に必要な機能を読み込む
    import {
        getAuth,              // Firebase認証機能を取得する
        GoogleAuthProvider,   // Googleログイン用の認証プロバイダ
        signInWithPopup,      // ポップアップ画面でログインする
        onAuthStateChanged,   // ログイン状態の変化を監視する
        signOut               // ログアウトする
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";


    // Cloud Firestore（データベース）に必要な機能を読み込む
    import {
        getFirestore,         // Firestoreを取得する
        collection,           // コレクションを指定する
        addDoc,               // 新しいデータを追加する
        updateDoc,            // 既存のデータを更新する
        deleteDoc,            // データを削除する
        doc,                  // ドキュメントを指定する
        onSnapshot            // データの変更をリアルタイムで監視する
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


    // -----------------------------------------
    // Firebaseの接続設定
    // -----------------------------------------

    // Firebaseプロジェクトの情報を設定する
    // この情報を使って、自分のFirebaseプロジェクトに接続する
    const firebaseConfig = {

        // FirebaseプロジェクトのAPIキー
        apiKey: "AIzaSyARjqUQbzRzCohqksJQLcB6BCJ2aBRMXkI",

        // Google認証に使用するドメイン
        authDomain: "shopping-memo-cdd46.firebaseapp.com",

        // FirebaseプロジェクトのID
        projectId: "shopping-memo-cdd46",

        // ファイル保存先のストレージ
        storageBucket: "shopping-memo-cdd46.firebasestorage.app",

        // Firebaseプロジェクトの送信者ID
        messagingSenderId: "516050821193",

        // Firebaseアプリを識別するID
        appId: "1:516050821193:web:a285fb3a4d1f383621df98",

        // Google Analyticsの測定ID
        measurementId: "G-FLXCX0395Y"
    };


    // -----------------------------------------
    // Firebaseの初期化
    // -----------------------------------------

    // 設定情報を使ってFirebaseアプリを初期化する
    const app = initializeApp(firebaseConfig);

    // Firebase Authenticationを利用できるようにする
    const auth = getAuth(app);

    // Firestoreデータベースを利用できるようにする
    const db = getFirestore(app);

    // Googleログイン用の認証プロバイダを作成する
    const provider = new GoogleAuthProvider();

    // Firestore内のshoppingItemsコレクションを参照する
    const itemsRef = collection(db, "shoppingItems");


    // -----------------------------------------
    // HTML要素の取得
    // -----------------------------------------

    // Googleログインボタンを取得する
    const loginButton = document.getElementById("loginButton");

    // ログアウトボタンを取得する
    const logoutButton = document.getElementById("logoutButton");

    // ログイン状態を表示する場所を取得する
    const loginStatus = document.getElementById("loginStatus");


    // Firestoreのリアルタイム監視を停止するための関数を保持する変数
    // ログアウト時などに使用する
    let unsubscribeItems = null;


    // -----------------------------------------
    // Googleログイン処理
    // -----------------------------------------

    // ログインボタンがクリックされたときに実行する
    loginButton.addEventListener("click", async () => {

        try {

            // Googleアカウントのログイン画面をポップアップで開く
            await signInWithPopup(auth, provider);

        } catch (error) {

            // ログインに失敗した場合、エラー内容を画面に表示する
            loginStatus.textContent = "ログイン失敗: " + error.message;
        }
    });


    // -----------------------------------------
    // ログアウト処理
    // -----------------------------------------

    // ログアウトボタンがクリックされたときに実行する
    logoutButton.addEventListener("click", async () => {

        try {

            // Firebaseからログアウトする
            await signOut(auth);

        } catch (error) {

            // ログアウトに失敗した場合、エラー内容を表示する
            loginStatus.textContent = "ログアウト失敗: " + error.message;
        }
    });


    // -----------------------------------------
    // ログイン状態の監視
    // -----------------------------------------

    // ログイン・ログアウトの状態が変化するたびに実行される
    onAuthStateChanged(auth, (user) => {

        // すでにFirestoreの監視を行っている場合
        if (unsubscribeItems) {

            // 以前の監視を停止する
            unsubscribeItems();

            // 停止したことを示すためnullに戻す
            unsubscribeItems = null;
        }


        // 共有機能を一度リセットする
        window.sharedShopping = null;

        // 商品一覧も空にする
        window.items = [];


        // userが存在しない場合はログアウト状態
        if (!user) {

            // 商品一覧を空にする
            itemsClear();

            // ログイン状態の表示を変更する
            loginStatus.textContent = "ログインしていません";

            // ログインボタンを表示する
            loginButton.hidden = false;

            // ログアウトボタンを非表示にする
            logoutButton.hidden = true;

            // 以降のログイン時の処理を行わず終了する
            return;
        }


        // -----------------------------------------
        // ログイン成功時の処理
        // -----------------------------------------

        // ログイン中のメールアドレスを表示する
        loginStatus.textContent = "ログイン中: " + user.email;

        // ログインボタンを非表示にする
        loginButton.hidden = true;

        // ログアウトボタンを表示する
        logoutButton.hidden = false;


        // -----------------------------------------
        // 商品データを操作するための関数をまとめる
        // -----------------------------------------

        // window.sharedShoppingとして公開することで、
        // 最初のscriptからもFirebaseの操作を呼び出せる
        window.sharedShopping = {

            // 商品を追加する関数
            addItem: (data) => addDoc(itemsRef, {

                // 渡された商品データをすべて追加する
                ...data,

                // 商品を追加した時刻を記録する
                createdAt: Date.now()
            }),

            // 商品を更新する関数
            // idで対象商品を指定し、dataの内容に更新する
            updateItem: (id, data) =>
                updateDoc(doc(db, "shoppingItems", id), data),

            // 商品を削除する関数
            // idで対象商品を指定して削除する
            deleteItem: (id) =>
                deleteDoc(doc(db, "shoppingItems", id))
        };


        // -----------------------------------------
        // Firestoreのリアルタイム監視
        // -----------------------------------------

        // shoppingItemsのデータが変更されるたびに処理を実行する
        unsubscribeItems = onSnapshot(

            // 監視するコレクション
            itemsRef,

            // データの取得・変更があったときに実行する処理
            (snapshot) => {

                // Firestoreから取得した商品データを配列に変換する
                window.items = snapshot.docs.map(document => ({

                    // Firestoreが自動的に付けたドキュメントID
                    id: document.id,

                    // 商品のデータを展開する
                    ...document.data()
                }));


                // 商品を追加日時の古い順に並べる
                window.items.sort((a, b) =>
                    (a.createdAt || 0) - (b.createdAt || 0)
                );


                // 最初のscriptで使う商品一覧を更新する
                itemsReplace(window.items);

                // 共有リストへの接続が完了したことを表示する
                loginStatus.textContent = "共有リスト接続中: " + user.email;
            },


            // Firestoreの読み込みに失敗した場合の処理
            (error) => {

                // エラーメッセージを画面に表示する
                loginStatus.textContent =
                    "共有リストを読み込めません。権限設定を確認してください。";

                // エラーの詳細を開発者ツールに表示する
                console.error("Firestore error:", error);
            }
        );
    });


    // -----------------------------------------
    // 商品一覧を空にする関数
    // -----------------------------------------

    function itemsClear() {

        // 空の配列を渡して商品一覧を更新する
        itemsReplace([]);
    }


    // -----------------------------------------
    // 商品一覧を更新する関数
    // -----------------------------------------

    function itemsReplace(newItems) {

        // 最初のscriptにあるupdateShoppingItems()を呼び出す
        // ?.は、関数が存在する場合だけ実行するという意味
        window.updateShoppingItems?.(newItems);
    }


    // -----------------------------------------
    // 商品一覧を画面に反映する関数
    // -----------------------------------------

    // Firestoreから商品一覧を受け取ったときに呼び出される
    window.updateShoppingItems = (newItems) => {

        // 最初のscriptで使用するitems配列を更新する
        items = newItems;

        // window.itemsも同じ商品一覧に更新する
        window.items = newItems;

        // 商品一覧を画面に表示し直す
        renderSharedItems(newItems);
    };


    // =========================================
    // 商品一覧の表示・並べ替え・操作を行う関数
    // =========================================

    function renderSharedItems(newItems) {

        // 商品一覧を表示するHTML要素を取得する
        const list = document.getElementById("list");

        // 以前表示されていた商品をすべて消去する
        list.innerHTML = "";


        // -----------------------------------------
        // 商品が存在しない場合
        // -----------------------------------------

        if (newItems.length === 0) {

            // 空であることを画面に表示する
            list.innerHTML = '<div class="empty">買い物リストは空です。</div>';

            // 以降の処理を行わず終了する
            return;
        }


        // -----------------------------------------
        // 商品の並べ替え
        // -----------------------------------------

        // 元のnewItems配列を直接変更しないようにコピーしてから並べ替える
        const sortedItems = [...newItems].sort((a, b) => {

            // 商品Aと商品Bの優先度を数値として取得する
            // 優先度が未設定の場合は0とする
            const priorityA = Number(a.priority || 0);
            const priorityB = Number(b.priority || 0);


            // 優先度が異なる場合
            if (priorityA !== priorityB) {

                // 優先度が高い商品を先にする
                return priorityB - priorityA;
            }


            // 削除チェックの状態を取得する
            // deleteCheckedがなければ、以前のcheckedを参照する
            // どちらもなければfalseとする
            const deleteA = a.deleteChecked ?? a.checked ?? false;
            const deleteB = b.deleteChecked ?? b.checked ?? false;


            // 削除チェックの状態が異なる場合
            if (deleteA !== deleteB) {

                // チェックなしの商品を先に、チェックありの商品を後にする
                return deleteA ? 1 : -1;
            }


            // 優先度と削除チェックが同じ場合
            // 追加日時が古い商品を先にする
            return (a.createdAt || 0) - (b.createdAt || 0);
        });


        // -----------------------------------------
        // 商品を1件ずつ画面に表示する
        // -----------------------------------------

        sortedItems.forEach((item) => {

            // 商品1件分のdiv要素を作成する
            const div = document.createElement("div");

            // itemというCSSクラスを設定する
            div.className = "item";


            // -----------------------------------------
            // 削除用チェックボックスの作成
            // -----------------------------------------

            // 削除対象にチェックが付いているか確認する
            // 古いデータに対応するため、checkedも確認する
            const deleteChecked =
                item.deleteChecked ?? item.checked ?? false;


            // 削除対象にチェックが付いている場合
            if (deleteChecked) {

                // checkedクラスを追加して背景色を変える
                div.classList.add("checked");
            }


            // チェックボックスを作成する
            const checkbox = document.createElement("input");

            // input要素の種類をチェックボックスにする
            checkbox.type = "checkbox";

            // Firestoreに保存されているチェック状態を反映する
            checkbox.checked = !!deleteChecked;


            // チェック状態が変更されたときの処理
            checkbox.addEventListener("change", async () => {

                try {

                    // 変更後のチェック状態をFirestoreに保存する
                    await window.sharedShopping.updateItem(item.id, {
                        deleteChecked: checkbox.checked
                    });

                } catch (error) {

                    // 更新に失敗した場合のメッセージ
                    alert("削除チェックの状態を更新できませんでした。");

                    // エラーの詳細を表示する
                    console.error(error);
                }
            });


            // -----------------------------------------
            // 商品名・個数・メモの表示領域
            // -----------------------------------------

            // 商品情報をまとめるdiv要素を作成する
            const content = document.createElement("div");

            // item-contentというCSSクラスを設定する
            content.className = "item-content";


            // 商品名を表示する要素を作成する
            const name = document.createElement("div");

            // item-nameというCSSクラスを設定する
            name.className = "item-name";

            // 商品名を設定する
            name.textContent = item.name;


            // 個数を表示する要素を作成する
            const quantity = document.createElement("div");

            // item-quantityというCSSクラスを設定する
            quantity.className = "item-quantity";

            // 商品の個数を「○個」という形式で表示する
            quantity.textContent = `${item.quantity}個`;


            // 商品名と個数を商品情報の領域に追加する
            content.append(name, quantity);


            // メモが入力されている場合
            if (item.memo) {

                // メモを表示する要素を作成する
                const memo = document.createElement("div");

                // item-memoというCSSクラスを設定する
                memo.className = "item-memo";

                // メモの内容を設定する
                memo.textContent = item.memo;

                // 商品情報の領域にメモを追加する
                content.appendChild(memo);
            }


            // -----------------------------------------
            // 優先度を表す星ボタンの作成
            // -----------------------------------------

            // 優先度を変更するボタンを作成する
            const priority = document.createElement("button");

            // priority-buttonというCSSクラスを設定する
            priority.className = "priority-button";


            // 現在の優先度を取得する
            // 未設定の場合は0とする
            const currentPriority = Number(item.priority || 0);


            // 優先度に応じて星の表示を変更する

            // 優先度0：☆☆☆
            if (currentPriority === 0) {
                priority.textContent = "☆☆☆";

            // 優先度1：☆☆★
            } else if (currentPriority === 1) {
                priority.textContent = "☆☆★";

            // 優先度2：☆★★
            } else if (currentPriority === 2) {
                priority.textContent = "☆★★";

            // 優先度3：★★★
            } else {
                priority.textContent = "★★★";
            }


            // 星ボタンがクリックされたときの処理
            priority.addEventListener("click", async () => {

                // 次の優先度を決定する
                // 3以上なら0に戻し、それ以外なら1増やす
                const nextPriority =
                    currentPriority >= 3 ? 0 : currentPriority + 1;


                try {

                    // 新しい優先度をFirestoreに保存する
                    await window.sharedShopping.updateItem(item.id, {
                        priority: nextPriority
                    });

                } catch (error) {

                    // 優先度の更新に失敗した場合のメッセージ
                    alert("優先度を更新できませんでした。");

                    // エラーの詳細を表示する
                    console.error(error);
                }
            });


            // -----------------------------------------
            // 商品カードを完成させて画面に追加する
            // -----------------------------------------

            // 左から順に、チェックボックス・商品情報・星ボタンを配置する
            div.append(checkbox, content, priority);

            // 完成した商品カードを商品一覧に追加する
            list.appendChild(div);
        });
    }

</script>

</body>
